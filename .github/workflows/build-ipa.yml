name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || sudo xcode-select -s "$(xcode-select -p)"
          xcodebuild -version
      - name: Unzip project
        run: |
          unzip -o taurus-2023-app.zip
          ls -la taurus-2023-app
      - name: Validate project
        run: |
          cd taurus-2023-app
          plutil -lint Taurus2023.xcodeproj/project.pbxproj
          plutil -lint Taurus2023/Info.plist
          xcodebuild -list -project Taurus2023.xcodeproj
      - name: Build app (no signing)
        run: |
          cd taurus-2023-app
          xcodebuild -project Taurus2023.xcodeproj -scheme Taurus2023 -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO -derivedDataPath DerivedData
      - name: Package IPA
        run: |
          cd taurus-2023-app
          APP=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" | head -n 1)
          if [ -z "$APP" ]; then APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Taurus2023.app" -path "*Release-iphoneos*" | head -n 1); fi
          test -n "$APP" || { echo "ERROR: no .app found in DerivedData"; find DerivedData -maxdepth 4 -type d | head -20; exit 1; }
          echo "APP=$APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r ../Taurus2023-unsigned.ipa Payload
          ls -lh ../Taurus2023-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Taurus2023-unsigned-ipa
          path: Taurus2023-unsigned.ipa
